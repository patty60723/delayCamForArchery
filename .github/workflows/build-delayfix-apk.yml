name: Build and verify LAN viewer trial APK

on:
  push:
    branches:
      - codex/lan-viewer-prototype
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_fastResumeTrial: "true"
  ORG_GRADLE_PROJECT_lanViewerTrial: "true"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache/restore@v4
        id: lan-signing-key
        with:
          path: ~/.android/debug.keystore
          key: delaycam-lan-viewer-signing-v1
      - name: Prepare cached debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            if [ -f ../docs/lan-viewer-signing-cert.sha256 ]; then
              echo "::error::The pinned LAN signing cache is missing. Restore the key; do not rotate an installed test package."
              exit 1
            fi
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "DELAYCAM_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1 > app/build-signing-cert.sha256
          if [ -f ../docs/lan-viewer-signing-cert.sha256 ]; then
            cmp app/build-signing-cert.sha256 ../docs/lan-viewer-signing-cert.sha256
          fi
      - uses: actions/cache/save@v4
        if: steps.lan-signing-key.outputs.cache-hit != 'true'
        with:
          path: ~/.android/debug.keystore
          key: delaycam-lan-viewer-signing-v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Lint design context
        run: npx -y -p @google/design.md designmd lint ../DESIGN.md
      - name: Verify browser palette and syntax
        run: |
          python3 ../scripts/sync-viewer-theme.py --check
          node --check app/src/main/assets/viewer/viewer.js
      - name: Run unit tests and build APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Report unit test results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('No unit test result files were produced')
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, '0'))
          print('UNIT_TEST_RESULTS', totals)
          if totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit('Unit tests failed or were skipped')
          PY
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          signed_apk_cert=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$signed_apk_cert" = "$(cat app/build-signing-cert.sha256)"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/apk-metadata.txt
          python3 - <<'PYMETA'
          from pathlib import Path
          metadata = Path('app/build/apk-metadata.txt').read_text()
          assert "name='com.archery.delaycam.lanviewer'" in metadata
          assert "versionName='0.3.0-lan-viewer-test'" in metadata
          assert "application-label:'多機19·箭影'" in metadata
          print('COEXISTENCE_APK_IDENTITY_OK')
          PYMETA
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: delaycam-lan-viewer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-ux-unit-test-results
          path: android/app/build/test-results/testDebugUnitTest/
          retention-days: 14

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download single-device test18 baseline for coexistence
        uses: actions/download-artifact@v4
        with:
          name: delaycam-fast-return-comparison-apk
          run-id: 38727110843
          github-token: ${{ github.token }}
          path: android/app/build/baseline18
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run recording and playback UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: android
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # CameraX smoke test requires an actual emulator camera Surface.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front emulated
          script: |
            chmod +x gradlew
            adb install -r app/build/baseline18/app-debug.apk
            ./gradlew :app:connectedDebugAndroidTest -PfastResumeTrial=true --no-daemon --stacktrace || { mkdir -p app/build/ui-screenshots; adb pull /sdcard/Pictures/ArcheryUiReview app/build/ui-screenshots; exit 1; }
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.archery.delaycam.fastresume > app/build/stable-installed.txt
            adb shell pm path com.archery.delaycam.lanviewer > app/build/trial-installed.txt
            test -s app/build/stable-installed.txt
            test -s app/build/trial-installed.txt
            echo COEXISTENCE_INSTALL_OK
            mkdir -p app/build/viewer-ci
            adb pull /sdcard/Android/data/com.archery.delaycam.lanviewer/files/viewer-ci/. app/build/viewer-ci/
            mkdir -p app/build/ui-screenshots
            adb pull /sdcard/Pictures/ArcheryUiReview app/build/ui-screenshots
      - name: Verify desktop browser against Android-captured H264
        run: |
          python3 -m pip install playwright==1.58.0
          viewer_sample=$(find app/build/viewer-ci -name '*.mp4' | head -1)
          test -n "$viewer_sample"
          python3 ../scripts/test-lan-viewer.py --media "$viewer_sample" --browser /usr/bin/google-chrome --output app/build/viewer-browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-ux-ui-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/ui-screenshots/
            android/app/build/viewer-ci/
            android/app/build/viewer-browser-results/
          retention-days: 14

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode H264 and exercise viewer recovery
        run: |
          python3 -m pip install playwright==1.58.0
          python3 scripts/test-lan-viewer.py --media android/app/src/androidTest/assets/clip-fixture.mp4 --browser /usr/bin/google-chrome --output browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-desktop-test-results
          path: browser-results/
          retention-days: 14
