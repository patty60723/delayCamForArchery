<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>箭影｜延遲觀看</title><link rel="stylesheet" href="viewer.css"><script src="viewer.js" defer></script></head>
<body>
<main id="stage">
<canvas id="hold" hidden aria-hidden="true"></canvas>
<video id="film" muted playsinline preload="auto" aria-label="拍攝端延遲畫面"></video>
<div id="welcome"><h1>箭影</h1><p>另一台螢幕，看剛才的一箭。</p><button id="start">開始觀看</button><p class="muted">電腦觀看測試版 · 影片保存在拍攝手機</p></div>
<header><strong>箭影</strong><span id="status" role="status" aria-live="polite">尚未開始觀看</span><span id="age" aria-live="off"></span></header>
<aside><button id="toggle" aria-expanded="false" aria-controls="panel">操作</button><div id="panel" hidden>
<p>觀看顯示</p><div class="choices"><button id="fit" aria-pressed="true">完整畫面</button><button id="fill" aria-pressed="false">滿版</button></div>
<p class="muted">滿版會裁切邊緣；錄影保留完整畫面。</p><button id="resume">接回目前延遲</button><p id="timing" class="muted">延遲由拍攝端設定</p><p class="muted">此版只觀看，不控制保存或錄影。片段切換可能短暫停頓。</p>
</div></aside>
<div id="notice" role="status" aria-live="polite" hidden></div>
</main></body></html>
